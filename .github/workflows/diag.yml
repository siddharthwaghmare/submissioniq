name: Diagnose model endpoint
on:
  push:
    branches: [main]
    paths: [eval/diag.sh]
permissions:
  contents: write
  models: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash eval/diag.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A eval/results && git commit -m "Endpoint diagnostics" && git pull --rebase origin main && git push origin HEAD:main
